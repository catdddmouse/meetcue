<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src file: data:">
<title>框选飞书字幕区域</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px -apple-system, "PingFang SC", sans-serif; user-select: none; }
  #bar { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box; }
  #wrap { position: relative; }
  #img { display: block; }
  #box { position: absolute; border: 2px solid #7aa7ff; background: rgba(122,167,255,0.18); display: none; }
  button { font: inherit; color: #eee; background: #333; border: 1px solid #555; border-radius: 8px; padding: 5px 12px; }
  button.primary { background: #7aa7ff; color: #0b1020; border-color: #7aa7ff; font-weight: 600; }
  .muted { color: #999; }
</style>
</head>
<body>
<div id="bar">
  <span>在截图上拖出飞书<b>字幕</b>所在的区域（字幕记录面板或底部字幕条）</span>
  <span class="muted" id="info"></span>
  <span style="flex:1"></span>
  <button id="btnAll">用整个窗口</button>
  <button id="btnSave" class="primary">保存并试读</button>
</div>
<div id="wrap"><img id="img" alt="飞书窗口截图"><div id="box"></div></div>
<script src="selector.js"></script>
</body>
</html>
